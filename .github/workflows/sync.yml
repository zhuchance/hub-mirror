name: Sync Images & Verify Hash

on:
  # 方式一：通过 Issue 自动触发
  issues:
    types: [opened, edited]
  # 方式二：在 Actions 页面直接手动点击输入触发
  workflow_dispatch:
    inputs:
      images:
        description: '请输入要同步的镜像（每行一个）'
        required: true
        type: string
        default: 'nginx:latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    # 过滤条件：Issue 触发需校验标题和作者；手动点击触发直接运行
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.title, 'sync') && github.event.issue.user.login == 'zhuchance') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALiyun_USER }}
          password: ${{ secrets.ALiyun_PWD }}

      - name: Run Go Sync
        env:
          # 根据触发方式自动选择获取源文本
          RAW_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.images }}
        run: |
          go run main.go \
            --images="$RAW_BODY" \
            --username="${{ secrets.ALiyun_USER }}" \
            --password="${{ secrets.ALiyun_PWD }}" \
            --registry="registry.cn-hangzhou.aliyuncs.com" \
            --namespace="mgfw" \
            --maxImages=20 \
            --outputPath=output.sh \
            --reportPath=report.md

      - name: Add Report to Summary
        if: always()
        run: |
          if [ -f report.md ]; then
            cat report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Success Comment
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let body = '🚀 **镜像同步与 Hash 校验已完成！**\n\n详细校验报告可在 Actions 运行页面的 Summary 查看。\n'

            // 如果有 output.sh，附带使用说明
            if (fs.existsSync('output.sh')) {
              const data = fs.readFileSync('output.sh', 'utf8')
              body += '\n您可以直接执行该命令：\n\n```shell\n'
              body += "echo -e '" + data.replace(/\n/g, '\\n') + "' | bash\n"
              body += '```\n\n或是手动执行：\n\n```shell\n' + data + '```\n'
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
