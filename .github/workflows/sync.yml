name: Sync Images via Issue

on:
  issues:
    types: [opened, edited]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    if: contains(github.event.issue.title, 'sync') && github.event.issue.user.login == 'zhuchance'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALiyun_USER }}
          password: ${{ secrets.ALiyun_PWD }}

      - name: Process Images (Non-Interactive Safe)
        env:
          RAW_BODY: ${{ github.event.issue.body }}
        run: |
          printf "%s" "$RAW_BODY" > raw_images.txt

          while IFS= read -r line || [[ -n "$line" ]]; do
            CLEAN_IMG=$(echo "$line" | tr -d '\r' | tr -d '`' | xargs)
            
            [[ -z "$CLEAN_IMG" ]] && continue
            [[ "$CLEAN_IMG" == *" "* ]] && continue

            echo "--------------------------------"
            echo "正在同步: [$CLEAN_IMG]"
            
            IMAGE_NAME_TAG=$(echo "$CLEAN_IMG" | awk -F'/' '{print $NF}')
            TARGET="registry.cn-hangzhou.aliyuncs.com/mgfw/${IMAGE_NAME_TAG}"
            
            # 注意：增加 < /dev/null 彻底阻断交互输入请求，防止 stdin 被抢占
            if docker pull "$CLEAN_IMG" < /dev/null; then
              docker tag "$CLEAN_IMG" "$TARGET"
              docker push "$TARGET" < /dev/null
              echo "✅ 成功推送: $TARGET"
            else
              echo "❌ 镜像拉取失败: $CLEAN_IMG"
            fi
          done < raw_images.txt

      - name: Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **非交互式同步已完成！**\n镜像已成功重命名并推送到阿里云 ACR。'
            })
